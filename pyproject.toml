[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnqbt"
version = "0.1.0"
description = "Research/backtest harness for a discretionary ICT/SMC MNQ setup (no live trading)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
databento = ["databento>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mnqbt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that take more than a few seconds"]
